name: SQLite service

# The hqq-sqlite C server (examples/sqlite/server) built on libhqq, its C unit
# tests, the Go tests of the sqlite package (fake server, no C server needed),
# and the Go end-to-end tests that run the Go driver against the C server
# (sqlite/e2e). On Linux and macOS SQLite comes from the system: libsqlite3-dev
# on Ubuntu, the SDK copy on macOS. On Windows (clang-cl) the pinned SQLite
# amalgamation is fetched and verified by scripts/release/fetch-sqlite.ps1, as
# the release does. Nothing else is downloaded.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Configure libhqq and the server
        run: |
          cmake -S c -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHQQ_WERROR=ON \
            -DHQQ_BUILD_TESTS=ON \
            -DHQQ_BUILD_STRESS=OFF \
            -DHQQ_BUILD_SQLITE_SERVER=ON

      - name: Build the server and its unit tests
        run: cmake --build build --config Release --target hqq-sqlite-server hqqsqlite_server_unit_tests

      - name: Unit tests (C)
        run: ctest --test-dir build -R hqqsqlite_server --output-on-failure

      - name: Go vet
        run: go vet ./sqlite/...

      - name: Go tests (Go driver and fake server, no C server)
        run: go test -race -count=1 ./sqlite/...

      - name: End-to-end tests (Go driver against the C server)
        env:
          HQQ_SQLITE_SERVER: ${{ github.workspace }}/build/sqlite-server/hqq-sqlite-server
        run: go test -count=1 -timeout 5m -v ./sqlite/e2e/...

  asan:
    name: Server ASan+UBSan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Configure and build the sanitized server
        run: |
          cmake -S c -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHQQ_WERROR=ON \
            -DHQQ_BUILD_TESTS=OFF \
            -DHQQ_BUILD_STRESS=OFF \
            -DHQQ_SANITIZE=address+undefined \
            -DHQQ_BUILD_SQLITE_SERVER=ON
          cmake --build build-asan --target hqq-sqlite-server

      - name: End-to-end tests against the sanitized server
        env:
          HQQ_SQLITE_SERVER: ${{ github.workspace }}/build-asan/sqlite-server/hqq-sqlite-server
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: go test -count=1 -timeout 10m -v ./sqlite/e2e/...

  server-windows:
    name: Server Windows ${{ matrix.arch }} (clang-cl)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64

    env:
      # The SQLite defines of the release (release.yml), passed through CMAKE_C_FLAGS.
      SQLITE_C_DEFINES: >-
        -DSQLITE_DQS=0
        -DSQLITE_OMIT_LOAD_EXTENSION
        -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1
        -DSQLITE_USE_URI=0

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}

      - name: Fetch and verify SQLite
        id: sqlite
        shell: pwsh
        run: |
          # A PowerShell script that runs no native command leaves $LASTEXITCODE
          # null, and `$null -ne 0` is true: reset it so only an explicit exit counts.
          $global:LASTEXITCODE = 0
          $dir = & scripts/release/fetch-sqlite.ps1 -Dest (Join-Path $env:RUNNER_TEMP 'sqlite-amalgamation')
          if ($LASTEXITCODE -ne 0) { throw 'fetch-sqlite.ps1 failed' }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure libhqq and the server
        shell: bash
        env:
          AMALGAMATION: ${{ steps.sqlite.outputs.dir }}
        run: |
          cmake -S c -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHQQ_WERROR=ON \
            -DHQQ_BUILD_TESTS=ON \
            -DHQQ_BUILD_STRESS=OFF \
            -DHQQ_BUILD_SQLITE_SERVER=ON \
            -DHQQ_SQLITE_AMALGAMATION_DIR="$AMALGAMATION" \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_C_FLAGS="$SQLITE_C_DEFINES"

      - name: Build the server and its unit tests
        shell: bash
        run: cmake --build build --target hqq-sqlite-server hqqsqlite_server_unit_tests

      - name: Unit tests (C)
        shell: bash
        run: ctest --test-dir build -R hqqsqlite_server --output-on-failure --timeout 120

      - name: Go vet
        shell: bash
        run: go vet ./sqlite/...

      - name: Go tests (Go driver and fake server, no C server)
        shell: bash
        run: go test -count=1 ./sqlite/...

      - name: End-to-end tests (Go driver against the C server)
        shell: bash
        run: |
          set -o pipefail
          export HQQ_SQLITE_SERVER="$GITHUB_WORKSPACE/build/sqlite-server/hqq-sqlite-server.exe"
          go test -count=1 -timeout 10m -v ./sqlite/... 2>&1 | tee e2e.log
          # The e2e packages skip without a usable binary. Fail on any skip except the
          # TestHelper* re-exec helpers (they always skip) and the Go fake server's
          # own contract cases (TestContractFake/TestContractDSN .../fake/...), which
          # skip SQL the fake does not implement and never involve the binary.
          if grep -- '--- SKIP' e2e.log | grep -v -- 'SKIP: TestHelper' | grep -qv -- '/fake/'; then
            echo "::error::an end-to-end test was skipped; the binary was not exercised"
            exit 1
          fi
