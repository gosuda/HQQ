name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install Linux graph tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Run vet
        run: go vet ./...

      # The end-to-end suite of hqq-bindgen builds and starts a C server and runs
      # in its own workflow (bindgen.yml) with timeouts that fit it.
      - name: Run tests
        shell: bash
        run: go test $(go list ./... | grep -v '/bindgen/e2e/') -count=1 -timeout=90s

      - name: Run multi-process and lifecycle tests
        run: go test . -run 'TestMultiProcess|TestPeer|TestThirdEndpoint|TestListenDial|TestOpener|TestCloseDoesNotRemove|TestUnlinkRemovesStaleName|TestLargeMessageThresholdAPI' -count=2 -v -timeout=120s

      - name: Run race tests
        if: runner.os != 'Windows'
        run: go test -race $(go list ./... | grep -v '/bindgen/e2e/') -count=1 -timeout=120s

      - name: Run fuzz smoke tests
        if: runner.os == 'Linux'
        run: |
          go test ./internal/protocol -run '^$' -fuzz=FuzzPacketRoundTrip -fuzztime=5s
          go test . -run '^$' -fuzz='^FuzzConsumeAdvancedChunk$' -fuzztime=5s
          go test . -run '^$' -fuzz='^FuzzOpenOverCorruptSuperblock$' -fuzztime=5s

  tlc:
    name: TLA+ Model Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run TLC on MPMC specification
        run: sh scripts/tlc.sh
