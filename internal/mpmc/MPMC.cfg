\* TLC configuration for MPMC.tla. Run with scripts/tlc.sh (no -deadlock:
\* producers and consumers loop forever, so a deadlock would be a bug).
\*
\* CI instance: BufferSize = 2, 2 producers, 2 consumers (MaxVal = 8).
\* A larger instance (BufferSize = 4, 2 producers, 2 consumers, MaxVal = 16)
\* was also checked manually with the same invariants and properties; see the
\* VERIFICATION STATUS comment in MPMC.tla. It is too slow for every CI run.
\*
\* No SYMMETRY: symmetry reduction is unsound for liveness checking.
SPECIFICATION Spec
CONSTANTS
    BufferSize = 2
    Producers = {p1, p2}
    Consumers = {c1, c2}
INVARIANTS
    TypeOK
    QueueSafety
    CompletionCAS
    NoRace
    DataIntegrity
    FIFOBound
PROPERTIES
    FIFOClaimOrder
    ProducerProgress
    ConsumerProgress
    SystemProgress
CHECK_DEADLOCK TRUE
